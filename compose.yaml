name: dostavo

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: dostavo-app:1.0.15
  command:
    - python
    - -m
    - reflex
    - run
    - --env
    - prod
    - --single-port
    - --backend-port
    - "8080"
  init: true
  restart: unless-stopped
  working_dir: /app
  environment:
    PYTHONUNBUFFERED: "1"
  volumes:
    - ./config:/app/config
    - ./data:/app/data
  expose:
    - "8080"
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5)"
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 120s

services:
  app-blue:
    <<: *app

  app-green:
    <<: *app

  mail-worker:
    image: dostavo-app:1.0.15
    command:
      - python
      - -m
      - modules.mail_worker
    init: true
    restart: unless-stopped
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./config:/app/config
      - ./data:/app/data

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.runtime/active-backend.conf:/etc/nginx/active-backend.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  certbot-webroot:
  letsencrypt:
