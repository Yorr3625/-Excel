events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 25m;
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    include /etc/nginx/active-backend.conf;

    map $cookie_dostavo_backend $selected_backend {
        default $active_backend;
        blue blue;
        green green;
        legacy legacy;
    }

    map $selected_backend $reflex_backend {
        default app-blue:8080;
        blue app-blue:8080;
        green app-green:8080;
        legacy app:8080;
    }

    map "$selected_backend:$draining_backend" $backend_cookie {
        default "dostavo_backend=$selected_backend; Path=/; Max-Age=43200; HttpOnly; Secure; SameSite=Lax";
        blue:blue "dostavo_backend=blue; Path=/; Expires=$draining_cookie_expires; HttpOnly; Secure; SameSite=Lax";
        green:green "dostavo_backend=green; Path=/; Expires=$draining_cookie_expires; HttpOnly; Secure; SameSite=Lax";
        legacy:legacy "dostavo_backend=legacy; Path=/; Expires=$draining_cookie_expires; HttpOnly; Secure; SameSite=Lax";
    }

    server {
        listen 80;
        listen [::]:80;
        server_name dostavo.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name dostavo.online;

        ssl_certificate /etc/letsencrypt/live/dostavo.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dostavo.online/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location / {
            proxy_pass http://$reflex_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header Set-Cookie $backend_cookie always;
        }

        location ^~ /api/ {
            proxy_pass http://$reflex_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header Cache-Control "no-store" always;
            add_header Set-Cookie $backend_cookie always;
        }
    }
}
